<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plutonium Network</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#08060a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#plu-loader{position:fixed;inset:0;display:grid;place-items:center;background:#08060a;z-index:2147483647}
#plu-loader-inner{text-align:center;opacity:.9}
#plu-loader-title{font-size:28px;font-weight:700;letter-spacing:.02em}
#plu-loader-sub{margin-top:10px;font-size:13px;opacity:.55}
#plu-loader-dot{display:inline-block;width:8px;height:8px;margin-left:6px;border-radius:50%;background:#e8175d;animation:plu-pulse 1s infinite}
@keyframes plu-pulse{50%{opacity:.25;transform:scale(.7)}}

#plu-debug-console {
  position: fixed;
  z-index: 2147483647;
  left: 10px;
  right: 10px;
  bottom: 10px;
  height: 260px;
  display: flex;
  flex-direction: column;
  background: rgba(8,8,12,.97);
  color: #eee;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 10px;
  box-shadow: 0 10px 40px rgba(0,0,0,.55);
  font: 12px/1.4 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  overflow: hidden;
}
#plu-debug-console.hidden { display:none; }
#plu-debug-console .plu-debug-head {
  min-height: 34px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 10px;
  background:rgba(255,255,255,.07);
  border-bottom:1px solid rgba(255,255,255,.12);
  user-select:none;
}
#plu-debug-console .plu-debug-title { font-weight:700; flex:1; }
#plu-debug-console button {
  border:0;
  border-radius:6px;
  padding:5px 9px;
  background:rgba(255,255,255,.10);
  color:#fff;
  cursor:pointer;
  font:inherit;
}
#plu-debug-console button:hover { background:rgba(255,255,255,.18); }
#plu-debug-console .plu-debug-log {
  flex:1;
  min-height:0;
  overflow:auto;
  padding:6px 0;
  white-space:pre-wrap;
  word-break:break-word;
}
#plu-debug-console .plu-debug-row {
  padding:4px 10px;
  border-bottom:1px solid rgba(255,255,255,.05);
}
#plu-debug-console .plu-debug-time { opacity:.45; margin-right:8px; }
#plu-debug-console .plu-debug-level { font-weight:700; margin-right:8px; }
#plu-debug-console .plu-debug-error { background:rgba(255,60,60,.12); }
#plu-debug-console .plu-debug-warn { background:rgba(255,190,50,.08); }
#plu-debug-console .plu-debug-info { background:rgba(80,150,255,.06); }
#plu-debug-toggle {
  position:fixed;
  z-index:2147483647;
  right:12px;
  bottom:12px;
  display:none;
  border:0;
  border-radius:7px;
  padding:7px 10px;
  background:#111;
  color:#fff;
  font:12px ui-monospace,monospace;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="plu-loader"><div id="plu-loader-inner"><div id="plu-loader-title">Plutonium<span id="plu-loader-dot"></span></div><div id="plu-loader-sub">Loading Plutonium Network…</div></div></div>

<script>
(() => {
  'use strict';

  const PLU_ROOT = 'https://cdn.jsdelivr.net/gh/Plutonium-Net/Plutonium@main/';
  const GCDN_ROOT = 'https://cdn.jsdelivr.net/gh/Plutonium-Net/Plutonium-GCDN@main/';
  const RAW_INDEX = PLU_ROOT + 'index.html';

  window.__PLU_SINGLE_FILE__ = true;
  window.__PLU_STATIC_ROOT__ = PLU_ROOT;
  window.__PLU_GCDN_ROOT__ = GCDN_ROOT;
  window.__PLU_REQUIRE_STATIC_ROOT__ = true;

  window.__PLU_DISABLE_AI__ = true;
  window.__PLU_DISABLE_PROXY__ = true;
  window.__PLU_DISABLE_CLOUD_GAMING__ = true;
  window.__PLU_DISABLE_VMS__ = true;
  window.__PLU_DISABLE_ACCOUNTS__ = true;
  window.__PLU_DISABLE_UPDATE_REQUIRED__ = true;

  window.PlutoniumStore = {
    currentUser: null,
    onAuthChange(fn) { try { fn(null); } catch (_) {} return () => {}; },
    async getDoc() { return null; },
    async setDoc() { return false; },
    async deleteDoc() { return false; },
    async signOut() {},
    async init() { return null; }
  };

  const nativeFetch = window.fetch.bind(window);

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
    );
  }

  function rewriteGcdn(value) {
    try {
      const u = new URL(value, location.href);
      if (u.hostname === 'g.cdn.plutoniumnet.work') {
        return GCDN_ROOT.replace(/\/$/, '') + u.pathname + u.search + u.hash;
      }
    } catch (_) {}
    return value;
  }

  window.fetch = function(input, init) {
    const rawUrl = input instanceof Request ? input.url : String(input || '');
    if (/\/js\/cloud\.js(?:\?|$)|\/data\/cloud\.json(?:\?|$)|\/css\/cloud\.css(?:\?|$)|\/img\/cloud\//i.test(rawUrl)) {
      return Promise.reject(new Error('Cloud Gaming is disabled in this build.'));
    }

    if (typeof input === 'string') {
      return nativeFetch(jsDelivrUrl(input), init);
    }

    if (input instanceof Request) {
      const rewritten = jsDelivrUrl(input.url);
      if (rewritten !== input.url) {
        return nativeFetch(rewritten, init);
      }
    }

    return nativeFetch(input, init);
  };

  function jsDelivrUrl(value, base = PLU_ROOT) {
    if (!value) return value;
    const v = String(value).trim();

    if (/^(data:|blob:|javascript:|mailto:|tel:|#)/i.test(v)) return v;

    try {
      const github = new URL(v, base);
      const host = github.hostname.toLowerCase();
      const path = github.pathname;

      if (host === 'raw.githubusercontent.com' &&
          /^\/plutonium-net\/plutonium\//i.test(path)) {
        return PLU_ROOT + path.replace(/^\/plutonium-net\/plutonium\//i, '') +
          github.search + github.hash;
      }

      if (host === 'raw.githubusercontent.com' &&
          /^\/plutonium-net\/plutonium-gcdn\//i.test(path)) {
        return GCDN_ROOT + path.replace(/^\/plutonium-net\/plutonium-gcdn\//i, '') +
          github.search + github.hash;
      }

      const ghMatch = path.match(/^\/plutonium-net\/(plutonium|plutonium-gcdn)\/(?:blob|raw)\/[^/]+\/(.*)$/i);
      if (host === 'github.com' && ghMatch) {
        const root = ghMatch[1].toLowerCase() === 'plutonium' ? PLU_ROOT : GCDN_ROOT;
        return root + ghMatch[2] + github.search + github.hash;
      }
    } catch (_) {}

    try {
      const jsd = new URL(v);
      if (jsd.hostname.toLowerCase() === 'cdn.jsdelivr.net' &&
          !/^\/(?:gh|npm|combine)(?:\/|$)/i.test(jsd.pathname)) {
        const p = jsd.pathname.replace(/^\/+/, '');
        if (p) return PLU_ROOT + p + jsd.search + jsd.hash;
      }
    } catch (_) {}

    if (/^https?:\/\/unpkg\.com\//i.test(v)) {
      const u = new URL(v);
      return 'https://cdn.jsdelivr.net/npm/' + u.pathname.replace(/^\/+/, '') +
        u.search + u.hash;
    }

    if (/^https?:\/\/cdnjs\.cloudflare\.com\//i.test(v)) {
      const u = new URL(v);
      return 'https://cdn.jsdelivr.net' + u.pathname + u.search + u.hash;
    }

    if (/^https?:\/\/g\.cdn\.plutoniumnet\.work(?:\/|$)/i.test(v)) {
      return rewriteGcdn(v);
    }

    if (/^https?:\/\//i.test(v)) return v;
    if (v.startsWith('/')) return PLU_ROOT + v.slice(1);

    return new URL(v, base).href;
  }

  (() => {
    const nativeSetAttribute = Element.prototype.setAttribute;

    Element.prototype.setAttribute = function(name, value) {
      const attr = String(name).toLowerCase();
      const tag = this.tagName.toLowerCase();

      if (
        (tag === 'script' && attr === 'src') ||
        (tag === 'link' && attr === 'href') ||
        (tag === 'img' && attr === 'src') ||
        (tag === 'source' && attr === 'src') ||
        (tag === 'iframe' && attr === 'src') ||
        (tag === 'video' && attr === 'src') ||
        (tag === 'audio' && attr === 'src')
      ) {
        if (/\/img\/cloud\//i.test(String(value || ''))) {
          value = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
        } else {
          value = jsDelivrUrl(value);
        }
      }

      return nativeSetAttribute.call(this, name, value);
    };

    const patchProperty = (proto, property) => {
      try {
        const descriptor = Object.getOwnPropertyDescriptor(proto, property);
        if (!descriptor || !descriptor.set || !descriptor.get) return;

        Object.defineProperty(proto, property, {
          configurable: descriptor.configurable,
          enumerable: descriptor.enumerable,
          get: descriptor.get,
          set(value) {
            if ((property === 'src') && /\/img\/cloud\//i.test(String(value || ''))) {
              value = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
            } else {
              value = jsDelivrUrl(value);
            }
            descriptor.set.call(this, value);
          }
        });
      } catch (_) {}
    };

    patchProperty(HTMLScriptElement.prototype, 'src');
    patchProperty(HTMLLinkElement.prototype, 'href');
    patchProperty(HTMLImageElement.prototype, 'src');
    patchProperty(HTMLSourceElement.prototype, 'src');
    patchProperty(HTMLIFrameElement.prototype, 'src');
    patchProperty(HTMLVideoElement.prototype, 'src');
    patchProperty(HTMLAudioElement.prototype, 'src');
  })();

  function isDisabledPlutoniumResource(value) {
    const raw = String(value || '');
    return (
      /\/js\/(?:ai|cloud|vms)\.js(?:\?|$)/i.test(raw) ||
      /\/data\/cloud\.json(?:\?|$)/i.test(raw) ||
      /\/css\/cloud\.css(?:\?|$)/i.test(raw) ||
      /\/img\/cloud\//i.test(raw) ||
      /\/(?:bridge|core|runtime)\//i.test(raw) ||
      /\/js\/net\.js(?:\?|$)/i.test(raw)
    );
  }

  try {
    if (navigator.serviceWorker && navigator.serviceWorker.register) {
      navigator.serviceWorker.register = function () {
        return Promise.reject(new Error('Service workers are disabled in this Plutonium single-file build.'));
      };
    }
  } catch (_) {}

  function rewriteCssText(css, cssUrl) {
    return css.replace(
      /url\(\s*(['"]?)(?!data:|blob:|https?:\/\/)([^'")]+)\1\s*\)/gi,
      (m, quote, path) => `url("${jsDelivrUrl(path.trim(), cssUrl)}")`
    ).replace(
      /url\(\s*(['"]?)(https?:\/\/unpkg\.com\/[^'")]+|https?:\/\/cdnjs\.cloudflare\.com\/[^'")]+)\1\s*\)/gi,
      (m, quote, url) => `url("${jsDelivrUrl(url)}")`
    );
  }

  async function fetchText(url, options = {}) {
    const resolvedUrl = jsDelivrUrl(url);
    const response = await nativeFetch(resolvedUrl, {
      credentials: 'omit',
      ...options
    });
    if (!response.ok) throw new Error(`HTTP ${response.status} while loading ${url}`);
    return response.text();
  }

  async function installBackgroundFrame() {
    const frame = document.getElementById('browser-bg-frame');
    if (!frame) return;

    try {
      const bgUrl = PLU_ROOT + 'bg.html';
      let source = await fetchText(bgUrl);
      const parser = new DOMParser();
      const doc = parser.parseFromString(source, 'text/html');

      doc.querySelectorAll('link[href]').forEach(link => {
        const href = link.getAttribute('href');
        if (href) link.setAttribute('href', jsDelivrUrl(href, bgUrl));
      });

      for (const link of Array.from(doc.querySelectorAll('link[rel="stylesheet"]'))) {
        const href = link.getAttribute('href');
        if (!href) continue;
        const cssUrl = jsDelivrUrl(href, bgUrl);
        const css = await fetchText(cssUrl);
        const style = doc.createElement('style');
        style.textContent = rewriteCssText(css, cssUrl);
        link.replaceWith(style);
      }

      for (const script of Array.from(doc.querySelectorAll('script[src]'))) {
        const src = jsDelivrUrl(script.getAttribute('src'), bgUrl);
        const text = await fetchText(src);
        const replacement = doc.createElement('script');
        replacement.textContent = text + `\n//# sourceURL=${src}`;
        script.replaceWith(replacement);
      }

      const blob = new Blob(['<!doctype html>\n' + doc.documentElement.outerHTML], {
        type: 'text/html'
      });
      const blobUrl = URL.createObjectURL(blob);
      frame.src = blobUrl;
      frame.addEventListener('load', () => setTimeout(() => URL.revokeObjectURL(blobUrl), 5000), { once: true });
    } catch (e) {
      console.warn('[Plutonium] Background failed to load:', e);
    }
  }

  function disableServerUi(doc) {
    const disabled = new Set(['pluto://ai', 'pluto://cloud', 'pluto://vms']);
    doc.querySelectorAll('[data-local-uri]').forEach(el => {
      if (!disabled.has(el.getAttribute('data-local-uri'))) return;
      el.setAttribute('aria-disabled', 'true');
      el.dataset.pluDisabled = 'true';
      el.style.opacity = '.45';
      el.style.cursor = 'not-allowed';
    });

    doc.querySelectorAll('#btn-user-page, #home-acct-signin-cta, #acct-google-btn, #acct-github-btn, #acct-auth-submit').forEach(el => {
      el.setAttribute('aria-disabled', 'true');
    });
  }

  let gameDocumentLoadId = 0;

  function escapeGameError(message) {
    return String(message).replace(/[&<>\"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
    );
  }

  function rewriteLegacyGameUrl(value) {
    if (typeof value !== 'string') return value;
    try {
      const url = new URL(value, GCDN_ROOT);
      if (url.hostname.toLowerCase() === 'g.cdn.plutoniumnet.work') {
        return GCDN_ROOT.replace(/\/$/, '') + url.pathname + url.search + url.hash;
      }
    } catch (_) {}
    return value;
  }

  function gameDocumentBridgeSource() {
    const legacyHost = JSON.stringify('g.cdn.plutoniumnet.work');
    const cdnRoot = JSON.stringify(GCDN_ROOT.replace(/\/$/, ''));

    return `
      (() => {
        'use strict';
        const legacyHost = ${legacyHost};
        const cdnRoot = ${cdnRoot};
        const rewrite = value => {
          if (typeof value !== 'string') return value;
          try {
            const url = new URL(value, document.baseURI);
            if (url.hostname.toLowerCase() === legacyHost) {
              return cdnRoot + url.pathname + url.search + url.hash;
            }
          } catch (_) {}
          return value;
        };

        const nativeFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
          if (typeof input === 'string') return nativeFetch(rewrite(input), init);
          if (input instanceof Request) {
            const url = rewrite(input.url);
            if (url !== input.url) return nativeFetch(new Request(url, input), init);
          }
          return nativeFetch(input, init);
        };

        const nativeOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
          const args = Array.prototype.slice.call(arguments);
          args[1] = rewrite(String(url));
          return nativeOpen.apply(this, args);
        };

        const patchUrlProperty = (prototype, property) => {
          const descriptor = Object.getOwnPropertyDescriptor(prototype, property);
          if (!descriptor || !descriptor.set || !descriptor.get) return;
          Object.defineProperty(prototype, property, {
            configurable: true,
            enumerable: descriptor.enumerable,
            get: descriptor.get,
            set(value) { descriptor.set.call(this, rewrite(String(value))); }
          });
        };
        [
          [HTMLScriptElement.prototype, 'src'], [HTMLLinkElement.prototype, 'href'],
          [HTMLImageElement.prototype, 'src'], [HTMLSourceElement.prototype, 'src'],
          [HTMLVideoElement.prototype, 'src'], [HTMLAudioElement.prototype, 'src'],
          [HTMLIFrameElement.prototype, 'src']
        ].forEach(([prototype, property]) => {
          try { patchUrlProperty(prototype, property); } catch (_) {}
        });

        const nativeSetAttribute = Element.prototype.setAttribute;
        Element.prototype.setAttribute = function (name, value) {
          if (/^(src|href|poster|data)$/i.test(name)) value = rewrite(String(value));
          return nativeSetAttribute.call(this, name, value);
        };

        const patchWorker = name => {
          const NativeWorker = window[name];
          if (!NativeWorker) return;
          const WrappedWorker = function (url, options) {
            return new NativeWorker(rewrite(String(url)), options);
          };
          WrappedWorker.prototype = NativeWorker.prototype;
          window[name] = WrappedWorker;
        };
        try { patchWorker('Worker'); patchWorker('SharedWorker'); } catch (_) {}

        try {
          if (navigator.serviceWorker) {
            navigator.serviceWorker.register = () =>
              Promise.reject(new Error('Service workers are unavailable in the single-file game viewer.'));
          }
        } catch (_) {}
      })();
    `;
  }

  async function loadGameDocument(url, iframe) {
    if (!iframe || !url) return false;
    console.log('[Plutonium] loadGameDocument:', url);
    const requestId = ++gameDocumentLoadId;
    const gameUrl = jsDelivrUrl(url, GCDN_ROOT);

    iframe.removeAttribute('src');
    iframe.srcdoc = '<!doctype html><html><body style="margin:0;background:#050505;color:#fff;font:14px system-ui;display:grid;place-items:center;height:100vh">Loading game…</body></html>';

    try {
      const response = await nativeFetch(gameUrl, { credentials: 'omit' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const source = await response.text();
      if (requestId !== gameDocumentLoadId || !iframe.isConnected) return false;

      const parser = new DOMParser();
      const doc = parser.parseFromString(source, 'text/html');
      const gameBase = new URL('./', gameUrl).href;
      const existingBase = doc.querySelector('head base[href]');

      if (existingBase) {
        existingBase.setAttribute(
          'href',
          rewriteLegacyGameUrl(new URL(existingBase.getAttribute('href'), gameBase).href)
        );
      } else {
        const base = doc.createElement('base');
        base.href = gameBase;
        doc.head.prepend(base);
      }

      doc.querySelectorAll('[src], [href], [poster], [data]').forEach(element => {
        ['src', 'href', 'poster', 'data'].forEach(attribute => {
          if (!element.hasAttribute(attribute)) return;
          const value = element.getAttribute(attribute);
          const rewritten = rewriteLegacyGameUrl(value);
          if (rewritten !== value) element.setAttribute(attribute, rewritten);
        });
      });
      doc.querySelectorAll('[srcset]').forEach(element => {
        const value = element.getAttribute('srcset');
        if (value && /(?:https?:)?\/\/g\.cdn\.plutoniumnet\.work/i.test(value)) {
          element.setAttribute('srcset', value.replace(/(?:https?:)?\/\/g\.cdn\.plutoniumnet\.work/gi, GCDN_ROOT.replace(/\/$/, '')));
        }
      });
      doc.querySelectorAll('style').forEach(style => {
        if (/(?:https?:)?\/\/g\.cdn\.plutoniumnet\.work/i.test(style.textContent)) {
          style.textContent = style.textContent.replace(/(?:https?:)?\/\/g\.cdn\.plutoniumnet\.work/gi, GCDN_ROOT.replace(/\/$/, ''));
        }
      });

      const bridge = doc.createElement('script');
      bridge.textContent = gameDocumentBridgeSource();
      const base = doc.querySelector('head base');
      if (base) base.insertAdjacentElement('afterend', bridge);
      else doc.head.prepend(bridge);

      iframe.srcdoc = '<!doctype html>\n' + doc.documentElement.outerHTML;
      return true;
    } catch (error) {
      if (requestId !== gameDocumentLoadId || !iframe.isConnected) return false;
      console.error('[Plutonium] Game document failed to load:', gameUrl, error);
      iframe.srcdoc = '<!doctype html><html><body style="margin:0;background:#050505;color:#fff;font:14px system-ui;display:grid;place-items:center;height:100vh"><div>Unable to load this game.<br><small>' + escapeGameError(error.message || error) + '</small></div></body></html>';
      return false;
    }
  }

  window.__PLU_LOAD_GAME_DOCUMENT__ = loadGameDocument;

  (() => {
    const descriptor = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, 'src');
    if (!descriptor?.get || !descriptor?.set) return;

    const isGcdnGameDocument = value => {
      const raw = String(value ?? '');
      let resolved = raw;
      try { resolved = new URL(raw, location.href).href; } catch (_) {}

      const isGcdn =
        /^https?:\/\/g\.cdn\.plutoniumnet\.work(?:\/|$)/i.test(resolved) ||
        /^https?:\/\/cdn\.jsdelivr\.net\/gh\/Plutonium-Net\/Plutonium-GCDN@[^/]+\//i.test(resolved);

      const isHtml =
        /\.html?(?:[?#]|$)/i.test(resolved) ||
        /\/index(?:\.html?)?(?:[?#]|$)/i.test(resolved);

      return isGcdn && isHtml;
    };

    Object.defineProperty(HTMLIFrameElement.prototype, 'src', {
      configurable: descriptor.configurable,
      enumerable: descriptor.enumerable,
      get: descriptor.get,
      set(value) {
        if (this.id === 'game-iframe' && isGcdnGameDocument(value)) {
          void loadGameDocument(String(value), this);
          return;
        }
        descriptor.set.call(this, value);
      }
    });

    const nativeIframeSetAttribute = HTMLIFrameElement.prototype.setAttribute;
    HTMLIFrameElement.prototype.setAttribute = function(name, value) {
      if (
        this.id === 'game-iframe' &&
        String(name).toLowerCase() === 'src' &&
        isGcdnGameDocument(value)
      ) {
        void loadGameDocument(String(value), this);
        return;
      }
      return nativeIframeSetAttribute.call(this, name, value);
    };
  })();

  window.__PLU_CLEAR_GAME_DOCUMENT__ = iframe => {
    gameDocumentLoadId += 1;
    if (!iframe) return;
    iframe.removeAttribute('srcdoc');
    iframe.src = 'about:blank';
  };

  async function boot() {
    const source = await fetchText(RAW_INDEX);
    const parser = new DOMParser();
    const doc = parser.parseFromString(source, 'text/html');

    doc.querySelectorAll('script[src]').forEach(script => {
      const src = script.getAttribute('src') || '';
      if (/\/(pwa|version)\.js(?:\?|$)/i.test(src)) script.remove();
      if (/\/(cloud-store|cloud-store-config|account|onboarding-redirect)\.js(?:\?|$)/i.test(src)) script.remove();
      if (isDisabledPlutoniumResource(src)) script.remove();
    });

    doc.querySelectorAll('img[src], source[src]').forEach(el => {
      const src = el.getAttribute('src') || '';
      if (/\/img\/cloud\//i.test(src)) {
        el.setAttribute('src', 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=');
      }
    });

    doc.querySelectorAll('link[rel="preconnect"]').forEach(x => x.remove());

    doc.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
      const href = link.getAttribute('href') || '';
      if (/cdnjs\.cloudflare\.com\/ajax\/libs\/font-awesome/i.test(href)) {
        link.setAttribute(
          'href',
          'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css'
        );
      }
    });

    doc.querySelectorAll('script[src]').forEach(script => {
      const src = script.getAttribute('src') || '';
      if (/cdnjs\.cloudflare\.com\/ajax\/libs\/marked\/9\.1\.6\/marked\.min\.js/i.test(src)) {
        script.setAttribute('src', 'https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js');
      }

      if (/unpkg\.com\/draggabilly@2\.2\.0\/dist\/draggabilly\.pkgd\.min\.js/i.test(src)) {
        script.setAttribute('src', 'https://cdn.jsdelivr.net/npm/draggabilly@2.2.0/dist/draggabilly.pkgd.min.js');
      }
    });

    disableServerUi(doc);

    doc.querySelectorAll('[src]').forEach(el => {
      const attr = el.getAttribute('src');
      if (!attr) return;
      if (/^data:|^blob:|^javascript:/i.test(attr)) return;
      el.setAttribute('src', jsDelivrUrl(attr));
    });

    doc.querySelectorAll('link[href]').forEach(el => {
      const href = el.getAttribute('href');
      if (!href || /^data:|^blob:|^javascript:/i.test(href)) return;
      el.setAttribute('href', jsDelivrUrl(href));
    });

    doc.querySelectorAll('[srcset]').forEach(el => {
      const raw = el.getAttribute('srcset') || '';
      el.setAttribute('srcset', raw.split(',').map(part => {
        const bits = part.trim().split(/\s+/);
        bits[0] = jsDelivrUrl(bits[0]);
        return bits.join(' ');
      }).join(', '));
    });

    const title = doc.title;
    document.title = title || 'Plutonium Network';
    doc.querySelectorAll('link[rel="manifest"]').forEach(el => el.remove());
    document.head.innerHTML = doc.head.innerHTML;

    document.body.innerHTML = doc.body.innerHTML;

    document.querySelectorAll('img[src], source[src]').forEach(el => {
      const src = el.getAttribute('src') || '';
      if (/\/img\/cloud\//i.test(src)) {
        el.setAttribute('src', 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=');
      }
    });
    document.querySelectorAll('link[href]').forEach(link => {
      const href = link.getAttribute('href') || '';
      if (/\/css\/cloud\.css(?:\?|$)/i.test(href)) link.remove();
    });

    const scripts = Array.from(document.querySelectorAll('script[src]'));
    for (const oldScript of scripts) {
      const src = oldScript.getAttribute('src');
      if (!src) continue;

      const absolute = jsDelivrUrl(src);
      if (
        isDisabledPlutoniumResource(absolute) ||
        /\/(pwa|version|cloud-store|cloud-store-config|account|onboarding-redirect)\.js(?:\?|$)/i.test(absolute)
      ) {
        oldScript.remove();
        continue;
      }

      try {
        const text = await fetchText(absolute);
        const replacement = document.createElement('script');
        for (const attr of oldScript.attributes) {
          if (attr.name !== 'src') replacement.setAttribute(attr.name, attr.value);
        }

        let code = text;

        if (/\/js\/games\.js(?:\?|$)/i.test(absolute)) {
          code = code
            .replaceAll(
              'https://g.cdn.plutoniumnet.work',
              GCDN_ROOT.replace(/\/$/, '')
            )
            .replaceAll(
              'https://cdn.jsdelivr.net/gh/Plutonium-Net/Plutonium-GCDN@main/',
              GCDN_ROOT
            )
            .replace(
              'target.postMessage(message, GAME_ORIGIN);',
              "target.postMessage(message, '*');"
            )
            .replace(
              /els\s*\[\s*['"]game-iframe['"]\s*\]\s*\.src\s*=\s*pendingGameUrl\s*;?/g,
              "void window.__PLU_LOAD_GAME_DOCUMENT__(pendingGameUrl, els['game-iframe']);"
            )
            .replace(
              /els\s*\[\s*['"]game-iframe['"]\s*\]\s*\.src\s*=\s*['"]{2}\s*;?/g,
              "window.__PLU_CLEAR_GAME_DOCUMENT__(els['game-iframe']);"
            )
            .replace(
              /if\s*\(\s*els\s*\[\s*['"]game-iframe['"]\s*\]\s*\)\s*els\s*\[\s*['"]game-iframe['"]\s*\]\s*\.src\s*=\s*els\s*\[\s*['"]game-iframe['"]\s*\]\s*\.src\s*;?/g,
              "if (els['game-iframe']) void window.__PLU_LOAD_GAME_DOCUMENT__(pendingGameUrl, els['game-iframe']);"
            );

          if (!code.includes('__PLU_LOAD_GAME_DOCUMENT__(pendingGameUrl')) {
            console.warn('[Plutonium] games.js direct loader patch did not match; iframe interception fallback remains active.');
          }
        }

        if (/\/js\/navigation\.js(?:\?|$)/i.test(absolute)) {
  code = 'window.coreReady = true;\nwindow.bridgeReady = true;\n' + 
         code.replace(/\bcoreReady\b/g, 'window.coreReady')
             .replace(/\bbridgeReady\b/g, 'window.bridgeReady');
}

        if (/\/js\/workspaces\.js(?:\?|$)/i.test(absolute)) {
          code = code
            .replace(
              "async function activate(key, suffix = '') {",
              `async function activate(key, suffix = '') {
    if (window.__PLU_DISABLE_AI__ && key === 'ai') return false;
    if (window.__PLU_DISABLE_CLOUD_GAMING__ && key === 'cloud') return false;
    if (window.__PLU_DISABLE_VMS__ && key === 'vms') return false;`
            )
            .replace(
              "link.href = bundle.css;",
              "link.href = new URL(bundle.css, window.__PLU_STATIC_ROOT__).href;"
            )
            .replace(
              "script.src = src;",
              "script.src = /^https?:\\/\\//i.test(src) ? src : new URL(src, window.__PLU_STATIC_ROOT__).href;"
            )
            .replace(
              "activeWorkspaceStyle.href = 'css/workspace.css';",
              "activeWorkspaceStyle.href = new URL('css/workspace.css', window.__PLU_STATIC_ROOT__).href;"
            )
            .replace(
              "sharedGlassStyle.href = 'css/glass.css?v=3';",
              "sharedGlassStyle.href = new URL('css/glass.css?v=3', window.__PLU_STATIC_ROOT__).href;"
            );
        }

        replacement.textContent = code + `\n//# sourceURL=${absolute}`;
        oldScript.replaceWith(replacement);
      } catch (e) {
        console.warn('[Plutonium] Optional/static script failed:', absolute, e);
        oldScript.remove();
      }
    }

    window.__PLU_PROXY_DISABLED__ = true;
    window.coreReady = true;
    window.__PLU_CORE_READY__ = true;
    try { globalThis.coreReady = true; } catch (_) {}
    window.getNetUrl = function (url) { return url; };
    window.getNetEngine = function () {
      try { return localStorage.getItem('plu_net_mode') || 'none'; } catch (_) { return 'none'; }
    };
    window.setNetEngine = function (engine) {
      try { localStorage.setItem('plu_net_mode', String(engine || 'none')); } catch (_) {}
      try { if (typeof syncEngineButtons === 'function') syncEngineButtons(); } catch (_) {}
    };
    window.initNetStack = async function () { return false; };
    window.runNetInit = function () { return false; };

    document.addEventListener('click', e => {
      const target = e.target.closest?.('[data-local-uri]');
      if (!target) return;
      const uri = target.getAttribute('data-local-uri');
      if (!['pluto://ai', 'pluto://cloud', 'pluto://vms'].includes(uri)) return;
      e.preventDefault();
      e.stopImmediatePropagation();
    }, true);

    await installBackgroundFrame();

    const loader = document.getElementById('plu-loader');
    if (loader) loader.remove();

    initConsole();
  }

  boot().catch(error => {
    console.error('[Plutonium] bootstrap failed:', error);
    const loader = document.getElementById('plu-loader');
    if (loader) {
      loader.innerHTML =
        '<div style="font-family:system-ui;text-align:center;max-width:760px;padding:32px">' +
        '<div style="font-size:24px;font-weight:700">Plutonium failed to load</div>' +
        '<div style="margin-top:12px;opacity:.65;font-size:14px;line-height:1.5">' +
        escapeHtml(error?.message || error) +
        '</div></div>';
    }
    initConsole();
  });

  function initConsole() {
    if (document.getElementById('plu-debug-console')) return;

    const consoleMarkup = `
      <div id="plu-debug-console">
        <div class="plu-debug-head">
          <span class="plu-debug-title">Plutonium Console Intercept</span>
          <span id="plu-debug-count">0 events</span>
          <button id="plu-debug-clear" type="button">Clear</button>
          <button id="plu-debug-hide" type="button">Hide</button>
        </div>
        <div id="plu-debug-log" class="plu-debug-log"></div>
      </div>
      <button id="plu-debug-toggle" type="button">Show Console</button>
    `;

    document.body.insertAdjacentHTML('beforeend', consoleMarkup);

    var panel = document.getElementById('plu-debug-console');
    var logBox = document.getElementById('plu-debug-log');
    var countBox = document.getElementById('plu-debug-count');
    var hideButton = document.getElementById('plu-debug-hide');
    var showButton = document.getElementById('plu-debug-toggle');
    var clearButton = document.getElementById('plu-debug-clear');

    if (clearButton) {
      clearButton.onclick = function () {
        logBox.textContent = '';
        window.__plu_debug_count = 0;
        countBox.textContent = '0 events';
      };
    }

    if (hideButton) {
      hideButton.onclick = function () {
        panel.classList.add('hidden');
        showButton.style.display = 'block';
      };
    }

    if (showButton) {
      showButton.onclick = function () {
        panel.classList.remove('hidden');
        showButton.style.display = 'none';
      };
    }

    if (window.__plu_debug_queue) {
      window.__plu_debug_queue.forEach(item => addLogEntry(item.level, item.args));
    }
  }

  window.__plu_debug_queue = [];
  window.__plu_debug_count = 0;

  var original = {
    log: console.log,
    info: console.info,
    warn: console.warn,
    error: console.error,
    debug: console.debug
  };

  function stringify(value) {
    if (typeof value === 'string') return value;
    if (value instanceof Error) {
      return value.stack || (value.name + ': ' + value.message);
    }
    try {
      var seen = [];
      return JSON.stringify(value, function (key, val) {
        if (typeof val === 'object' && val !== null) {
          if (seen.indexOf(val) !== -1) return '[Circular]';
          seen.push(val);
        }
        if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
        return val;
      }, 2);
    } catch (_) {
      try { return String(value); } catch (_) { return '[Unprintable]'; }
    }
  }

  function addLogEntry(level, args) {
    window.__plu_debug_count++;
    var countBox = document.getElementById('plu-debug-count');
    var logBox = document.getElementById('plu-debug-log');

    if (countBox) countBox.textContent = window.__plu_debug_count + (window.__plu_debug_count === 1 ? ' event' : ' events');

    if (!logBox) {
      window.__plu_debug_queue.push({level: level, args: args});
      return;
    }

    var row = document.createElement('div');
    row.className = 'plu-debug-row plu-debug-' +
      (level === 'error' ? 'error' : level === 'warn' ? 'warn' : 'info');

    var time = document.createElement('span');
    time.className = 'plu-debug-time';
    time.textContent = new Date().toLocaleTimeString();

    var label = document.createElement('span');
    label.className = 'plu-debug-level';
    label.textContent = '[' + level.toUpperCase() + ']';

    var message = document.createElement('span');
    message.textContent = Array.prototype.map.call(args, stringify).join(' ');

    row.appendChild(time);
    row.appendChild(label);
    row.appendChild(message);
    logBox.appendChild(row);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function intercept(name) {
    console[name] = function () {
      var args = Array.prototype.slice.call(arguments);
      addLogEntry(name, args);
      try {
        if (typeof original[name] === 'function') {
          original[name].apply(console, args);
        }
      } catch (_) {}
    };
  }

  ['log', 'info', 'warn', 'error', 'debug'].forEach(intercept);

  window.addEventListener('error', function (event) {
    addLogEntry('error', [
      'UNCAUGHT ERROR:',
      event.message || 'Unknown error',
      event.filename ? ('at ' + event.filename + ':' + event.lineno + ':' + event.colno) : '',
      event.error || ''
    ]);
  }, true);

  window.addEventListener('unhandledrejection', function (event) {
    addLogEntry('error', [
      'UNHANDLED PROMISE REJECTION:',
      event.reason || 'Unknown rejection'
    ]);
  }, true);

  addLogEntry('info', ['Console interception active.']);
})();
</script>
